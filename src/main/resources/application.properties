spring.application.name=IncidentManagement

# Porta utilizada pelo front-end (static/js/auth.js)
server.port=8090

# Banco de dados (MySQL) - valores podem ser sobrescritos por variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/incident_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

spring.jpa.open-in-view=false

# Segurança (JWT)
api.security.token.secret=${JWT_SECRET:12345678}

# CORS - origens do front-end autorizadas (separadas por vírgula, aceita curingas)
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://167.234.235.128:*}

# Upload da foto do aluno
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Documentação (Swagger / OpenAPI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
