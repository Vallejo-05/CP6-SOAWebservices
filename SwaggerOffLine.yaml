openapi: 3.1.0
info:
  title: Incident Management
  description: "API REST para registro e acompanhamento de ocorrências escolares.\
    \ Perfis: PROFESSOR, ANALISTA, COORDENADOR e ADMINISTRATIVO."
  version: v1
servers:
- url: http://localhost:8090
  description: Generated server url
tags:
- name: Usuários
  description: Gestão de usuários (perfil ADMINISTRATIVO) e troca da própria senha
- name: Ocorrências
  description: "Registro, consulta, acompanhamento e dashboard de ocorrências"
- name: Alunos
  description: "Cadastro e gestão de alunos (escrita: perfil ADMINISTRATIVO)"
- name: Tipos de ocorrência
  description: "Tipos de ocorrência vinculados a categorias (escrita: perfil ADMINISTRATIVO)"
- name: Turmas
  description: "Turmas semestrais e vínculo de alunos (escrita: perfil ADMINISTRATIVO)"
- name: Categorias
  description: "Categorias de ocorrência (escrita: perfil ADMINISTRATIVO)"
paths:
  /users:
    get:
      tags:
      - Usuários
      summary: Listar usuários (paginado)
      operationId: list
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserResponse"
      security:
      - bearer-key: []
    put:
      tags:
      - Usuários
      summary: Atualizar nome e login do usuário
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Usuários
      summary: Cadastrar usuário
      description: A senha é armazenada criptografada (BCrypt).
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      security:
      - bearer-key: []
    patch:
      tags:
      - Usuários
      summary: Atualizar o perfil do usuário
      operationId: changeRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      security:
      - bearer-key: []
  /students:
    get:
      tags:
      - Alunos
      summary: Listar alunos ativos (paginado)
      operationId: list_1
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageStudentResponse"
      security:
      - bearer-key: []
    put:
      tags:
      - Alunos
      summary: Atualizar nome e data de nascimento do aluno
      operationId: update_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Alunos
      summary: Cadastrar aluno
      description: Data de nascimento no formato dd/MM/yyyy.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentResponse"
      security:
      - bearer-key: []
  /schoolclasses:
    get:
      tags:
      - Turmas
      summary: Listar turmas ativas (paginado)
      operationId: list_2
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageSchoolClassResponse"
      security:
      - bearer-key: []
    put:
      tags:
      - Turmas
      summary: Atualizar turma
      operationId: update_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolClassUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchoolClassResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Turmas
      summary: Cadastrar turma
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolClassCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchoolClassResponse"
      security:
      - bearer-key: []
  /incidents:
    get:
      tags:
      - Ocorrências
      summary: "Consultar ocorrências (paginado, com filtros)"
      description: "Filtros opcionais por aluno, turma, categoria, tipo, status e\
        \ período (yyyy-MM-dd). Também serve de base para relatórios."
      operationId: list_3
      parameters:
      - name: studentId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: schoolClassId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - WAITING
          - PROGRESSING
          - SOLVED
          - UNSOLVED
          - CLOSED
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: deleted
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageIncidentResponse"
      security:
      - bearer-key: []
    put:
      tags:
      - Ocorrências
      summary: Alterar ocorrência
      description: O professor só pode alterar as próprias ocorrências.
      operationId: update_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Ocorrências
      summary: Registrar ocorrência
      description: "Perfil PROFESSOR. O aluno deve pertencer à turma e o tipo à categoria.\
        \ registerDate no formato dd/MM/yyyy - HH:mm (opcional: assume o momento atual)."
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentResponse"
      security:
      - bearer-key: []
  /incident-types/{id}:
    get:
      tags:
      - Tipos de ocorrência
      summary: Consultar tipo de ocorrência
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentTypeResponse"
      security:
      - bearer-key: []
    put:
      tags:
      - Tipos de ocorrência
      summary: Atualizar tipo de ocorrência
      operationId: update_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentTypeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentTypeResponse"
      security:
      - bearer-key: []
    delete:
      tags:
      - Tipos de ocorrência
      summary: Excluir tipo de ocorrência
      description: Somente tipos sem ocorrências registradas.
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /categories/{id}:
    get:
      tags:
      - Categorias
      summary: Consultar categoria
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
      security:
      - bearer-key: []
    put:
      tags:
      - Categorias
      summary: Renomear categoria
      operationId: update_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
      security:
      - bearer-key: []
    delete:
      tags:
      - Categorias
      summary: Excluir categoria
      description: Somente categorias sem tipos e sem ocorrências.
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /schoolclasses/{id}/students:
    get:
      tags:
      - Turmas
      summary: Listar alunos da turma
      description: Usado para escolher o aluno ao registrar uma ocorrência.
      operationId: students
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Turmas
      summary: Vincular alunos à turma
      operationId: linkStudents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentsLinkRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentResponse"
      security:
      - bearer-key: []
  /login:
    post:
      tags:
      - Autenticação
      summary: Efetuar login
      description: "Retorna o token JWT a ser enviado no cabeçalho Authorization:\
        \ Bearer <token>."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login efetuado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: "Login ou senha inválidos, ou usuário inativo"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /incident-types:
    get:
      tags:
      - Tipos de ocorrência
      summary: Listar tipos de ocorrência
      description: Filtro opcional pelo nome da categoria.
      operationId: list_4
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentTypeResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Tipos de ocorrência
      summary: Cadastrar tipo de ocorrência
      operationId: create_4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentTypeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentTypeResponse"
      security:
      - bearer-key: []
  /categories:
    get:
      tags:
      - Categorias
      summary: Listar categorias
      operationId: list_5
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
      security:
      - bearer-key: []
    post:
      tags:
      - Categorias
      summary: Cadastrar categoria
      description: "O nome é padronizado (ex.: \"Pedagógica\" vira PEDAGOGICA)."
      operationId: create_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
      security:
      - bearer-key: []
  /users/password:
    patch:
      tags:
      - Usuários
      summary: Alterar a própria senha
      description: Disponível para qualquer usuário autenticado.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
        required: true
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /students/{id}/image:
    get:
      tags:
      - Alunos
      summary: Obter foto do aluno
      description: "Endpoint público, usado em <img src>."
      operationId: photo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
      security:
      - bearer-key: []
    patch:
      tags:
      - Alunos
      summary: Enviar foto do aluno
      description: Multipart com o arquivo no campo 'image' (máximo 2MB).
      operationId: uploadPhoto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentResponse"
      security:
      - bearer-key: []
  /incidents/status:
    get:
      tags:
      - Ocorrências
      summary: Listar status possíveis
      operationId: statuses
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusResponse"
      security:
      - bearer-key: []
    patch:
      tags:
      - Ocorrências
      summary: Alterar status da ocorrência
      description: Perfil COORDENADOR. Ocorrências fechadas não podem mais ser alteradas.
      operationId: changeStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentResponse"
      security:
      - bearer-key: []
  /users/{id}:
    get:
      tags:
      - Usuários
      summary: Consultar usuário
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      security:
      - bearer-key: []
    delete:
      tags:
      - Usuários
      summary: Inativar usuário
      description: Exclusão lógica. Não é permitido inativar o próprio usuário.
      operationId: inactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /users/roles:
    get:
      tags:
      - Usuários
      summary: Listar perfis disponíveis
      operationId: roles
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
      security:
      - bearer-key: []
  /students/{id}:
    get:
      tags:
      - Alunos
      summary: Consultar aluno
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentResponse"
      security:
      - bearer-key: []
    delete:
      tags:
      - Alunos
      summary: Inativar aluno
      description: "Exclusão lógica: o histórico de ocorrências é preservado."
      operationId: inactivate_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /students/{id}/incidents:
    get:
      tags:
      - Alunos
      summary: Histórico de ocorrências do aluno
      description: Inclui as ocorrências de todas as turmas do aluno.
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "registerDate,DESC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageIncidentResponse"
      security:
      - bearer-key: []
  /schoolclasses/{id}:
    get:
      tags:
      - Turmas
      summary: Consultar turma
      operationId: get_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchoolClassResponse"
      security:
      - bearer-key: []
    delete:
      tags:
      - Turmas
      summary: Cancelar turma
      description: "Exclusão lógica: as ocorrências da turma são preservadas."
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /schoolclasses/shifts:
    get:
      tags:
      - Turmas
      summary: Listar turnos
      operationId: shifts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
      security:
      - bearer-key: []
  /schoolclasses/semesters:
    get:
      tags:
      - Turmas
      summary: Listar semestres
      operationId: semesters
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
      security:
      - bearer-key: []
  /schoolclasses/canceled:
    get:
      tags:
      - Turmas
      summary: Listar turmas canceladas (paginado)
      operationId: listCanceled
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
